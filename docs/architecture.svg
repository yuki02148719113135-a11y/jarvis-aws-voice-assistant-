<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="-apple-system, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Noto Sans CJK JP', 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker>
    <marker id="ahx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker>
  </defs>
  <rect width="1000" height="620" fill="#FFFFFF"/>

  <!-- Browser -->
  <rect x="20" y="150" width="120" height="80" rx="8" fill="#F6F8FA" stroke="#57606A" stroke-width="1.5"/>
  <text x="80" y="185" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2328">ブラウザ</text>
  <text x="80" y="207" text-anchor="middle" font-size="12" fill="#57606A">マイク / 再生</text>

  <!-- AWS Cloud -->
  <rect x="170" y="20" width="640" height="580" rx="10" fill="#FFFFFF" stroke="#232F3E" stroke-width="2"/>
  <text x="186" y="44" font-size="14" font-weight="600" fill="#232F3E">AWS 東京リージョン (ap-northeast-1)</text>

  <!-- ephemeral -->
  <rect x="190" y="60" width="410" height="340" rx="8" fill="#FFF7ED" stroke="#EA8A2E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="600" y="78" text-anchor="end" font-size="12" font-weight="600" fill="#B45309">ephemeral/（毎回 destroy）</text>

  <!-- VPC -->
  <rect x="205" y="90" width="380" height="295" rx="6" fill="#F3FAF4" stroke="#2E8540" stroke-width="1.5"/>
  <text x="243" y="110" font-size="13" font-weight="600" fill="#2E8540">VPC</text>

  <!-- Subnets -->
  <rect x="220" y="150" width="170" height="222" rx="5" fill="#E6F4EA" stroke="#7CB98A" stroke-width="1"/>
  <text x="228" y="364" font-size="11" fill="#2E6B3A">パブリックサブネット 1a</text>
  <rect x="400" y="150" width="170" height="222" rx="5" fill="#E6F4EA" stroke="#7CB98A" stroke-width="1"/>
  <text x="408" y="364" font-size="11" fill="#2E6B3A">パブリックサブネット 1c</text>

  <!-- ALB spanning both subnets -->
  <rect x="235" y="170" width="320" height="40" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.5"/>
  <text x="395" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">ALB（2AZ）</text>

  <!-- Fargate -->
  <rect x="235" y="250" width="140" height="60" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.5"/>
  <text x="305" y="275" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">Fargate タスク</text>
  <text x="305" y="294" text-anchor="middle" font-size="11" fill="#57606A">FastAPI / Spot</text>

  <!-- Gateway endpoints -->
  <rect x="415" y="315" width="140" height="40" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.5"/>
  <text x="485" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2328">ゲートウェイEP</text>
  <text x="485" y="348" text-anchor="middle" font-size="11" fill="#57606A">S3 / DynamoDB（無料）</text>

  <!-- IGW on VPC left edge -->
  <rect x="180" y="175" width="50" height="30" rx="4" fill="#FFFFFF" stroke="#2E8540" stroke-width="1.5"/>
  <text x="205" y="195" text-anchor="middle" font-size="11" font-weight="600" fill="#2E8540">IGW</text>

  <!-- persistent -->
  <rect x="190" y="420" width="410" height="160" rx="8" fill="#EEF4FB" stroke="#3B6FB6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="600" y="438" text-anchor="end" font-size="12" font-weight="600" fill="#2F5A96">persistent/（消さない）</text>

  <rect x="205" y="470" width="88" height="62" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.5"/>
  <text x="249" y="497" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">ECR</text>
  <text x="249" y="516" text-anchor="middle" font-size="11" fill="#57606A">直近5世代</text>
  <rect x="303" y="470" width="88" height="62" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.5"/>
  <text x="347" y="497" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">DynamoDB</text>
  <text x="347" y="516" text-anchor="middle" font-size="11" fill="#57606A">会話履歴 / TTL</text>
  <rect x="401" y="470" width="88" height="62" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.5"/>
  <text x="445" y="497" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">S3</text>
  <text x="445" y="516" text-anchor="middle" font-size="11" fill="#57606A">tfstate 2層</text>
  <rect x="499" y="470" width="88" height="62" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.5"/>
  <text x="543" y="497" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">IAM</text>
  <text x="543" y="516" text-anchor="middle" font-size="11" fill="#57606A">タスクロール</text>
  <text x="395" y="562" text-anchor="middle" font-size="11" fill="#2F5A96">ephemeral 側は terraform_remote_state で output を参照</text>

  <!-- Bedrock -->
  <rect x="625" y="150" width="165" height="70" rx="8" fill="#EDE7FB" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="707" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#3F2A85">Amazon Bedrock</text>
  <text x="707" y="199" text-anchor="middle" font-size="12" fill="#3F2A85">Nova 2 Sonic</text>

  <!-- Note -->
  <rect x="625" y="440" width="165" height="120" rx="6" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
  <text x="637" y="462" font-size="12" font-weight="600" fill="#1F2328">構成A のポイント</text>
  <text x="637" y="484" font-size="11" fill="#57606A">タスクへの流入は</text>
  <text x="637" y="500" font-size="11" fill="#57606A">ALB の SG からのみ許可</text>
  <text x="637" y="522" font-size="11" fill="#57606A">NAT・インターフェースEP</text>
  <text x="637" y="538" font-size="11" fill="#57606A">なしで約 6 円/時</text>

  <!-- Open-Meteo (internet) -->
  <rect x="840" y="258" width="140" height="70" rx="8" fill="#FFF1E8" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="910" y="286" text-anchor="middle" font-size="13" font-weight="600" fill="#9A3412">Open-Meteo</text>
  <text x="910" y="306" text-anchor="middle" font-size="11" fill="#9A3412">天気 API（キー不要）</text>
  <text x="910" y="348" text-anchor="middle" font-size="11" fill="#57606A">インターネット</text>

  <!-- ===== Arrows (drawn last so fills never cover them) ===== -->
  <line x1="140" y1="190" x2="178" y2="190" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="230" y1="190" x2="233" y2="190" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="80" y="252" text-anchor="middle" font-size="11" fill="#1F2328">WebSocket</text>
  <text x="80" y="268" text-anchor="middle" font-size="11" fill="#57606A">idle_timeout 300秒</text>

  <line x1="305" y1="210" x2="305" y2="248" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="312" y="234" font-size="11" fill="#57606A">スティッキー</text>

  <polyline points="375,262 707,262 707,222" fill="none" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="615" y="255" text-anchor="middle" font-size="11" fill="#1F2328">双方向ストリーム</text>

  <line x1="375" y1="292" x2="838" y2="292" stroke="#C2410C" stroke-width="1.8" marker-end="url(#ahx)"/>
  <text x="710" y="285" text-anchor="middle" font-size="11" fill="#9A3412">HTTPS（Sprint 2）</text>

  <polyline points="345,310 345,335 413,335" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah)"/>
  <polyline points="440,355 440,450 360,450 360,468" fill="none" stroke="#1F2328" stroke-width="1.5" marker-end="url(#ah)"/>

  <line x1="260" y1="470" x2="260" y2="312" stroke="#57606A" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah)"/>
  <text x="266" y="410" font-size="11" fill="#57606A">イメージ pull</text>
</svg>
