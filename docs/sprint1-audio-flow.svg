<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 462" width="1000" height="462" font-family="-apple-system, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Noto Sans CJK JP', 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker>
  </defs>
  <rect width="1000" height="462" fill="#FFFFFF"/>

  <!-- lanes -->
  <rect x="20" y="20" width="400" height="340" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="36" y="44" font-size="14" font-weight="600" fill="#1F2328">ブラウザ</text>
  <rect x="470" y="20" width="170" height="340" rx="10" fill="#FFF7ED" stroke="#EA8A2E"/>
  <text x="486" y="44" font-size="14" font-weight="600" fill="#B45309">FastAPI（Fargate）</text>
  <rect x="690" y="20" width="290" height="340" rx="10" fill="#EDE7FB" stroke="#6B4FBB"/>
  <text x="706" y="44" font-size="14" font-weight="600" fill="#3F2A85">Amazon Bedrock</text>

  <text x="30" y="80" font-size="12" font-weight="600" fill="#57606A">話す（上り）</text>
  <text x="30" y="250" font-size="12" font-weight="600" fill="#57606A">聞く（下り）</text>

  <!-- upstream boxes -->
  <rect x="35" y="95" width="105" height="64" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.5"/>
  <text x="87" y="123" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">マイク</text>
  <text x="87" y="143" text-anchor="middle" font-size="11" fill="#57606A">通常 48kHz</text>
  <rect x="165" y="95" width="115" height="64" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.5"/>
  <text x="222" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2328">AudioContext</text>
  <text x="222" y="136" text-anchor="middle" font-size="11" fill="#57606A">16kHz に</text>
  <text x="222" y="150" text-anchor="middle" font-size="11" fill="#57606A">リサンプル</text>
  <rect x="300" y="95" width="105" height="64" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.5"/>
  <text x="352" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2328">AudioWorklet</text>
  <text x="352" y="136" text-anchor="middle" font-size="11" fill="#57606A">float32 →</text>
  <text x="352" y="150" text-anchor="middle" font-size="11" fill="#57606A">int16</text>

  <!-- downstream boxes -->
  <rect x="35" y="265" width="105" height="64" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.5"/>
  <text x="87" y="293" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">スピーカー</text>
  <text x="87" y="313" text-anchor="middle" font-size="11" fill="#57606A">24kHz</text>
  <rect x="165" y="265" width="115" height="64" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.5"/>
  <text x="222" y="288" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2328">連結再生</text>
  <text x="222" y="306" text-anchor="middle" font-size="10" fill="#57606A">AudioBuffer</text>
  <text x="222" y="320" text-anchor="middle" font-size="10" fill="#57606A">SourceNode</text>
  <rect x="300" y="265" width="105" height="64" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.5"/>
  <text x="352" y="288" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2328">受信</text>
  <text x="352" y="306" text-anchor="middle" font-size="11" fill="#57606A">JSON →</text>
  <text x="352" y="320" text-anchor="middle" font-size="11" fill="#57606A">base64 デコード</text>

  <!-- FastAPI -->
  <rect x="490" y="95" width="130" height="64" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.5"/>
  <text x="555" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">中継</text>
  <text x="555" y="142" text-anchor="middle" font-size="11" fill="#57606A">base64 化のみ</text>
  <rect x="490" y="265" width="130" height="64" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.5"/>
  <text x="555" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">中継</text>
  <text x="555" y="312" text-anchor="middle" font-size="11" fill="#57606A">JSON で転送</text>
  <text x="555" y="212" text-anchor="middle" font-size="11" fill="#B45309">サンプルレートの</text>
  <text x="555" y="228" text-anchor="middle" font-size="11" fill="#B45309">変換はしない</text>

  <!-- Bedrock -->
  <rect x="745" y="95" width="180" height="234" rx="8" fill="#FFFFFF" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="835" y="200" text-anchor="middle" font-size="15" font-weight="600" fill="#3F2A85">Nova 2 Sonic</text>
  <text x="835" y="222" text-anchor="middle" font-size="11" fill="#57606A">speech-to-speech</text>
  <text x="835" y="122" text-anchor="middle" font-size="11" fill="#57606A">入力 16kHz PCM</text>
  <text x="835" y="312" text-anchor="middle" font-size="11" fill="#57606A">出力 24kHz PCM</text>

  <!-- notes -->
  <text x="20" y="392" font-size="12" fill="#1F2328">サンプルレートの扱いはブラウザで完結させ、Fargate 側の CPU 負荷を最小にしている。</text>
  <text x="20" y="414" font-size="12" fill="#57606A">AudioWorklet は gain 0 のノード経由で destination に接続（接続先がないと process() が呼ばれないブラウザがあるため）。</text>
  <text x="20" y="436" font-size="12" fill="#57606A">ユーザーが話し始めて割り込まれたら、再生待ちの音声キューを破棄する。</text>

  <!-- arrows -->
  <line x1="140" y1="127" x2="163" y2="127" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="280" y1="127" x2="298" y2="127" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="405" y1="127" x2="488" y2="127" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="446" y="185" text-anchor="middle" font-size="11" fill="#1F2328">WebSocket</text>
  <text x="446" y="200" text-anchor="middle" font-size="11" fill="#57606A">バイナリ</text>
  <line x1="620" y1="127" x2="743" y2="127" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="682" y="118" text-anchor="middle" font-size="11" fill="#57606A">16kHz / base64</text>

  <line x1="743" y1="297" x2="622" y2="297" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="682" y="288" text-anchor="middle" font-size="11" fill="#57606A">24kHz / base64</text>
  <line x1="490" y1="297" x2="407" y2="297" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="446" y="355" text-anchor="middle" font-size="11" fill="#1F2328">WebSocket JSON</text>
  <line x1="300" y1="297" x2="282" y2="297" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="165" y1="297" x2="142" y2="297" stroke="#1F2328" stroke-width="1.8" marker-end="url(#ah)"/>
</svg>
